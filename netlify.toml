[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  PNPM_FLAGS = "--shamefully-hoist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Content-Security-Policy is set per page in out/_headers by scripts/postbuild.mjs (hash-based, no 'unsafe-inline' for scripts).
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Casa Lume: le due varianti sono state unite in un'unica scheda
[[redirects]]
  from = "/progetti/casa-lume-boutique"
  to = "/progetti/casa-lume/"
  status = 301
  force = true

[[redirects]]
  from = "/progetti/casa-lume-dimora"
  to = "/progetti/casa-lume/#variante"
  status = 301
  force = true
