[build]
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  PNPM_FLAGS = "--shamefully-hoist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Baseline policy. Each page also gets a stricter, hash-based policy from out/_headers (scripts/postbuild.mjs):
    # when both apply, the browser enforces both, so inline scripts must match a hash.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Casa Lume: le due varianti sono state unite in un'unica scheda
[[redirects]]
  from = "/progetti/casa-lume-boutique"
  to = "/progetti/casa-lume/"
  status = 301
  force = true

[[redirects]]
  from = "/progetti/casa-lume-dimora"
  to = "/progetti/casa-lume/#variante"
  status = 301
  force = true
